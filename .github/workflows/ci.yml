# Checks every pull request and every push to main. Nothing here calls a live source or needs a token:
# adapter tests read recorded responses (tests/fixtures).
#
# One job, "Checks", the one check main requires: in a private repository GitHub bills each job's minutes
# rounded up, so the four short jobs this used to be cost five minutes a run where one costs three or four.
# Each check still runs when one before it failed, so a pull request sees all its failures at once. A push
# to main runs only the tests and the web build, which a deploy goes by: lint, types and the Android app's
# types ran on its pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports_follow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sports -d sports_follow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # One throwaway database: migrated to head, then the tests that need Postgres empty it themselves.
      DATABASE_URL: postgresql+psycopg://sports:sports@localhost:5432/sports_follow
      SPORTS_FOLLOW_TEST_DATABASE_URL: postgresql+psycopg://sports:sports@localhost:5432/sports_follow
      SPORTS_FOLLOW_STOCKFISH: /usr/games/stockfish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # as in the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22  # as in the Dockerfile
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      # The API and worker: migrations, then the tests.
      - name: Install Stockfish
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends stockfish
      # The app's own packages too: the type check reads their types.
      - name: Install dependencies
        id: python
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations have one head
        run: |
          heads=$(alembic heads)
          echo "$heads"
          test "$(echo "$heads" | wc -l)" -eq 1
      - name: Migrate an empty database
        run: alembic upgrade head
      - name: Models match the migrations
        run: alembic check
      # Includes tests/test_web_names.py: web/src names sports and sources no more than it did.
      - name: Tests
        run: python -m pytest -q -rs

      # Lint and types, on a pull request.
      - name: Lint
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.python.outcome == 'success' }}
        run: ruff check --output-format=github .
      # Fails only on errors not in .basedpyright/baseline.json.
      - name: Types
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.python.outcome == 'success' }}
        run: basedpyright

      # The website.
      - name: Website dependencies
        id: web
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Website type-check and build
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        working-directory: web
        run: npm run build

      # The Android app's types, on a pull request. Also checks the web files the app shares
      # (web/src/types.ts, format.ts, follow.ts, sports/naming.ts).
      - name: Android app dependencies
        id: mobile
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Android app type-check
        if: ${{ !cancelled() && steps.mobile.outcome == 'success' }}
        working-directory: mobile
        run: npm run typecheck
