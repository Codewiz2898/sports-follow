// The engine of a chess board's Play from here, in a hidden WebView of its own (src/main/java/io/slam/chessengine):
// an Expo module of this app's own, linked like any other (expo-module.config.json).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.slam'
version = '1.0.0'

android {
  namespace "io.slam.chessengine"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  // The engine's files beside its page (src/main/assets/engine), served from the app's assets: copied at each
  // build from the website's own (web/src/sports/engine), never a second copy in the repo.
  sourceSets.main.assets.srcDirs += "$buildDir/generated/chess-engine/assets"
}

// The engine's files, by name (its page, src/main/assets/engine/page.js, names the two it runs). A name with no
// file stops the build, rather than an app that ships without its engine: a Copy that matches nothing is skipped,
// not failed. tests/test_credits.py holds these names, the page's and the web's to files in the folder.
def engineDir = file("../../../../web/src/sports/engine")
def engineFiles = ["stockfish-18-lite-single.js", "stockfish-18-lite-single.wasm", "Copying.txt"]
def engineThere = tasks.register("chessEngineThere") {
  doLast {
    def missing = engineFiles.findAll { !new File(engineDir, it).isFile() }
    if (missing) throw new GradleException("The chess engine's ${missing.join(', ')} isn't in $engineDir: see its README.md")
  }
}
tasks.register("chessEngineFiles", Copy) {
  dependsOn(engineThere)
  from(engineDir) { include engineFiles }
  into("$buildDir/generated/chess-engine/assets/engine")
}
preBuild.dependsOn("chessEngineFiles")

dependencies {
  // WebViewAssetLoader and the page's message channel; the version react-native-webview builds with.
  implementation 'androidx.webkit:webkit:1.14.0'
}
