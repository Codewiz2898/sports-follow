# Production: everything on one server. Run from the repo root:
#   docker compose -f deploy/compose.yaml up -d --build
# DOMAIN and SECRETS_DIR come from deploy/.env on the server (see README.md). Only Caddy is reachable
# from outside (ports 80 and 443); Postgres, Redis, the gateway and the API talk on the compose network.
name: sports-follow

x-app: &app
  image: sports-follow:latest
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - settings.env
    - ${SECRETS_DIR:-/etc/sports-follow}/app.env   # DATABASE_URL, SPORTS_FOLLOW_GATEWAY_TOKEN
  environment:
    REDIS_URL: redis://redis:6379/0
    LLM_GATEWAY_URL: http://gateway:8787
    SPORTS_FOLLOW_SPORTMONKS_TOKEN_FILE: /run/secrets/sportmonks-token
    SPORTS_FOLLOW_LICHESS_TOKEN_FILE: /run/secrets/lichess-token
    SPORTS_FOLLOW_VAPID_KEY: /run/secrets/vapid-private.pem
  volumes:
    - ${SECRETS_DIR:-/etc/sports-follow}/files:/run/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "sports_follow.server:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${API_WORKERS:-2}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  worker:
    <<: *app
    command: ["arq", "sports_follow.worker.WorkerSettings"]
    # Leave the API a core: the chess engine already caps itself (nice 10, half duty).
    cpus: 1.5
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  gateway:
    build: ./gateway
    image: sports-follow-gateway:latest
    restart: unless-stopped
    env_file:
      - ${SECRETS_DIR:-/etc/sports-follow}/gateway.env   # OPENROUTER_API_KEY, SPORTS_FOLLOW_GATEWAY_TOKEN
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sports
      POSTGRES_DB: sports_follow
    env_file:
      - ${SECRETS_DIR:-/etc/sports-follow}/postgres.env   # POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_follow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Jobs, locks and live fan-out: a snapshot a minute is plenty; nothing here is the only copy.
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: sports
      PGDATABASE: sports_follow
      KEEP_DAYS: 14
    env_file:
      - ${SECRETS_DIR:-/etc/sports-follow}/postgres.env
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-/var/backups/sports-follow}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redis-data:
  caddy-data:
  caddy-config:
