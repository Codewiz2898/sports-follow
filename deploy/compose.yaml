# Production: everything on one server. Run from the repo root:
#   docker compose -f deploy/compose.yaml up -d --build
# DOMAIN and SECRETS_DIR come from deploy/.env on the server (see README.md). Only Caddy is reachable
# from outside (ports 80 and 443); Postgres, the two Redis, the gateway and the API talk on the compose network.
name: sports-follow

x-app: &app
  image: sports-follow:latest
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      SPORTS_FOLLOW_COMMIT: ${SPORTS_FOLLOW_COMMIT:-}   # deploy.sh: the commit being built, for /api/health
  restart: unless-stopped
  env_file:
    - settings.env
    - ${SECRETS_DIR:-/etc/sports-follow}/app.env   # DATABASE_URL, SPORTS_FOLLOW_GATEWAY_TOKEN
    # Where traces and log lines go, and the key to send them (OTEL_EXPORTER_OTLP_*; README.md, "Traces
    # and logs"). Without it, they don't leave the server.
    - path: ${SECRETS_DIR:-/etc/sports-follow}/otlp.env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    SPORTS_FOLLOW_CACHE_REDIS_URL: redis://cache:6379/0   # what the sources answered (adapters/cache.py)
    LLM_GATEWAY_URL: http://gateway:8787
    SPORTS_FOLLOW_SITE_URL: https://${DOMAIN}   # who the app is to push services and data sources
    SPORTS_FOLLOW_SPORTMONKS_TOKEN_FILE: /run/secrets/sportmonks-token
    SPORTS_FOLLOW_LICHESS_TOKEN_FILE: /run/secrets/lichess-token
    SPORTS_FOLLOW_PANDASCORE_TOKEN_FILE: /run/secrets/pandascore-token   # optional: esports team titles
    SPORTS_FOLLOW_LIQUIPEDIA_TOKEN_FILE: /run/secrets/liquipedia-token   # optional: battle royale (needs a commercial plan)
    SPORTS_FOLLOW_PUBG_TOKEN_FILE: /run/secrets/pubg-token   # optional: PUBG esports
    SPORTS_FOLLOW_VAPID_KEY: /run/secrets/vapid-private.pem
    SPORTS_FOLLOW_FCM_KEY_FILE: /run/secrets/fcm-service-account.json   # optional: the Android app's notifications (FCM)
    SPORTS_FOLLOW_COOKIE_SECRET_FILE: /run/secrets/cookie-secret   # signs fan cookies; the API won't start without it
    SPORTS_FOLLOW_RESEND_KEY_FILE: /run/secrets/resend-key   # optional: sign-in codes by email
    SPORTS_FOLLOW_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google-client-secret   # optional: Continue with Google
    SPORTS_FOLLOW_ADMIN_PASSWORD_FILE: /run/secrets/admin-password   # optional: the admin panel (/admin), its password's hash and authenticator key
    SPORTS_FOLLOW_LINEAR_KEY_FILE: /run/secrets/linear-key   # optional: the admin panel's Linear plan and issue count (a read-only key)
  volumes:
    - ${SECRETS_DIR:-/etc/sports-follow}/files:/run/secrets:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    cache:
      condition: service_started   # reads go on without it: each process keeps its own copy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    # Forwarded headers are trusted from the compose network only (FORWARDED_ALLOW_IPS, in the Dockerfile).
    command: ["uvicorn", "sports_follow.server:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--workers", "${API_WORKERS:-2}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  worker:
    <<: *app
    command: ["arq", "sports_follow.worker.WorkerSettings"]
    # Leave the API a core: the chess engine already caps itself (nice 10, half duty).
    cpus: 1.5
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  gateway:
    build: ./gateway
    image: sports-follow-gateway:latest
    restart: unless-stopped
    env_file:
      - ${SECRETS_DIR:-/etc/sports-follow}/gateway.env   # OPENROUTER_API_KEY, SPORTS_FOLLOW_GATEWAY_TOKEN
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sports
      POSTGRES_DB: sports_follow
    env_file:
      - ${SECRETS_DIR:-/etc/sports-follow}/postgres.env   # POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_follow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Jobs, locks and live fan-out: a snapshot a minute is plenty; nothing here is the only copy.
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # What the data sources answered (adapters/cache.py), shared by the API and the worker. A Redis of its
  # own: capped, and evicting the least recently used key when full, which the one above must never do (a
  # lock or a budget count evicted is a job run twice or a quota overspent). Its snapshot keeps it through a
  # restart; it isn't the only copy of anything, so losing it costs requests, nothing more.
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${CACHE_REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru", "--save", "300", "100", "--appendonly", "no"]
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: sports
      PGDATABASE: sports_follow
      KEEP_DAYS: 14
    env_file:
      - ${SECRETS_DIR:-/etc/sports-follow}/postgres.env
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-/var/backups/sports-follow}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redis-data:
  cache-data:
  caddy-data:
  caddy-config:
