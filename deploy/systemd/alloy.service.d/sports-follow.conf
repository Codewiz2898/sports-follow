# Installed by deploy/server-setup.sh as /etc/systemd/system/alloy.service.d/sports-follow.conf.
# Alloy (Grafana's package) runs this repo's config, and only once Grafana Cloud's metrics settings are on
# the server: /etc/sports-follow/grafana.env, from push-secrets.sh, which starts it.
[Unit]
ConditionPathExists=/etc/sports-follow/grafana.env

[Service]
# Read after the package's /etc/default/alloy, so these win.
EnvironmentFile=/opt/sports-follow/deploy/alloy/alloy.env
EnvironmentFile=/etc/sports-follow/grafana.env
